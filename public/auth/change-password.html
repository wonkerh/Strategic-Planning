<!doctype html>
<html lang="en"><head>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Change password | Strategic Planning Stokvel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../styles.css"></head><body>
<header class="site-header"><div class="nav"><a class="brand" href="../index.html" aria-label="Strategic Planning home"><img src="/icon-192.png" alt="Strategic Planning logo" style="width: 2rem; height: 2rem; object-fit: contain;">Strategic Planning</a><div class="nav-actions"><a class="btn btn-ghost btn-sm" href="../dashboard.html">Dashboard</a></div></div></header>
<main>
<div class="page-head"><h1>Change password</h1><p>Confirm your current password, then choose a new one.</p></div>
<section class="section"><div style="max-width:28rem;display:grid;gap:1rem">
<form class="card" id="f" novalidate>
  <h3>Password</h3>
  <label>Current password<input id="cur" type="password" autocomplete="current-password" required></label>
  <label>New password<input id="p1" type="password" autocomplete="new-password" minlength="6" required></label>
  <label>Confirm new password<input id="p2" type="password" autocomplete="new-password" minlength="6" required></label>
  <p class="err" id="err" hidden></p>
  <p class="note" id="ok" hidden style="color:var(--ok);font-weight:600"></p>
  <button class="btn btn-primary" type="submit" style="justify-self:start">Update password</button>
</form>
</div></section>
</main>
<footer><div class="wrap legal" style="border-top:none">&copy; 2026 Strategic Planning. All rights reserved.</div></footer>
<script src="../app.js"></script>
<script src="auth.js"></script>
<script>
if(!API.user) location.replace("login.html");
$("f").onsubmit = async function(e){
  e.preventDefault(); hideErr("err"); $("ok").hidden = true;
  var a = $("p1").value, b = $("p2").value;
  if(a !== b) return showErr("err", "New passwords do not match");
  try{
    await API.call("/auth/change-password", { method:"POST", body: JSON.stringify({
      current: $("cur").value, next: a
    })});
    $("f").reset();
    var ok = $("ok"); ok.textContent = "Password updated."; ok.hidden = false;
  }catch(ex){ showErr("err", ex.message); }
};
</script>
</body></html>
